services:
  # Development: docker compose --profile dev up --build  -> http://localhost:4200
  dev:
    build:
      context: .
      target: dev
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    profiles: ["dev"]

  # Production: docker compose --profile prod up --build  -> http://localhost:8080
  prod:
    build:
      context: .
      target: prod
    ports:
      - "8080:8080"
    environment:
      # The browser calls the API directly, so this is the address it can reach
      API_URL: ${API_URL:-/api}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles: ["prod"]
