server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Liveness probe used by the container healthcheck
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Deployment settings generated at startup from environment variables
  location = /config.json {
    alias /tmp/config.json;
    default_type application/json;
    include /tmp/security-headers.inc;
    add_header Cache-Control "no-store" always;
  }

  # Hashed build output can be cached forever
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
    include /tmp/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The app shell must always be revalidated so new deployments are picked up
  location / {
    include /tmp/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
