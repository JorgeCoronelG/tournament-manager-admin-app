<h2 mat-dialog-title>{{ "teams.manager.editTitle" | transloco }}</h2>

<form (submit)="$event.preventDefault(); save()" novalidate>
  <mat-dialog-content class="!pt-2 min-w-[320px]">
    <app-manager-fields [form]="managerForm" [modes]="modes" />
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close type="button">
      {{ "common.cancel" | transloco }}
    </button>
    <button
      [disabled]="managerForm().submitting()"
      color="primary"
      mat-flat-button
      type="submit"
    >
      {{ "common.save" | transloco }}
    </button>
  </mat-dialog-actions>
</form>
