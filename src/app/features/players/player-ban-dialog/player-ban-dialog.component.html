<h2 mat-dialog-title>{{ "players.ban.title" | transloco }}</h2>

<form (submit)="$event.preventDefault(); save()" novalidate>
  <mat-dialog-content class="flex flex-col gap-2 !pt-2 min-w-[320px]">
    @if (serverError(); as message) {
      <div
        class="flex items-center gap-3 mb-2 p-3 rounded border border-red-500 bg-red-50 text-red-900 dark:border-red-400 dark:bg-red-950 dark:text-red-200"
        role="alert"
      >
        <mat-icon class="shrink-0" svgIcon="mat:error" />
        <p class="m-0 text-sm whitespace-pre-line">{{ message }}</p>
      </div>
    }

    <p
      class="m-0 mb-2"
      [innerHTML]="
        'players.ban.message' | transloco: { name, code: player.user_code }
      "
    ></p>

    <mat-form-field>
      <mat-label>{{ "players.ban.reason" | transloco }}</mat-label>
      <textarea [formField]="banForm.reason" matInput rows="3"></textarea>
      @if (banForm.reason().errors().length) {
        <mat-error>{{ errorText(banForm.reason().errors()) }}</mat-error>
      }
    </mat-form-field>

    <div
      class="flex items-center gap-3 mb-2 p-3 rounded border border-amber-500 bg-amber-50 text-amber-900 dark:border-amber-400/50 dark:bg-amber-400/10 dark:text-amber-200"
      role="status"
    >
      <mat-icon class="shrink-0" svgIcon="mat:warning" />
      <p class="m-0 text-sm whitespace-pre-line">
        {{ "players.ban.info" | transloco }}
      </p>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close type="button">
      {{ "common.cancel" | transloco }}
    </button>
    <button
      [disabled]="banForm().submitting()"
      color="warn"
      mat-flat-button
      type="submit"
    >
      {{ "players.ban.confirm" | transloco }}
    </button>
  </mat-dialog-actions>
</form>
