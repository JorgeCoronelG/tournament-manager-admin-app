<app-secondary-toolbar [current]="'agenda.title' | transloco">
  <app-breadcrumbs [crumbs]="crumbs()" [homeLabel]="'nav.home' | transloco" />
</app-secondary-toolbar>

<app-page-layout>
  <app-page-layout-content>
    @if (!leagueContext.activeLeague()) {
      <app-league-required />
    } @else {
      <p class="m-0 mb-4 text-sm text-secondary">
        {{ "matches.agenda.leagueWide" | transloco }}
      </p>
      <app-agenda-view
        (openCalendar)="openCalendar($event)"
        [tournaments]="tournaments()"
      />
    }
  </app-page-layout-content>
</app-page-layout>
