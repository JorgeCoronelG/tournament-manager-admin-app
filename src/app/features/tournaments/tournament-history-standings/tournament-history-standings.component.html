@if (resource.error()) {
  <div class="bg-foreground rounded shadow py-10 px-6 text-center" role="alert">
    <p class="text-secondary mb-4">
      {{ "tournaments.history.stats.error" | transloco }}
    </p>
    <button (click)="resource.reload()" mat-stroked-button type="button">
      {{ "common.retry" | transloco }}
    </button>
  </div>
} @else if (!resource.hasValue()) {
  <div aria-busy="true" class="animate-pulse">
    <div class="h-4 w-80 max-w-full rounded bg-gray-500/20"></div>
    <div class="bg-foreground rounded shadow mt-4 p-4">
      @for (row of [1, 2, 3, 4, 5]; track row) {
        <div class="mt-3 h-8 rounded bg-gray-500/10 first:mt-0"></div>
      }
    </div>
  </div>
} @else if (!hasRows()) {
  <p
    class="bg-foreground rounded shadow m-0 py-10 px-6 text-center text-secondary"
  >
    {{ "tournaments.history.stats.empty" | transloco }}
  </p>
} @else {
  <app-standings-view
    [editable]="false"
    [finished]="true"
    [groups]="groups()"
    [playoffs]="playoffs()"
    [tournamentId]="id()!"
    [tournamentName]="name()"
  />
}
