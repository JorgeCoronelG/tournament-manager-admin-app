<app-secondary-toolbar [current]="'dashboard.title' | transloco">
  <app-breadcrumbs [crumbs]="crumbs()" [homeLabel]="'nav.home' | transloco" />
</app-secondary-toolbar>

<app-page-layout>
  <app-page-layout-content>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      @for (stat of stats; track stat.key) {
        <div class="bg-foreground rounded shadow p-6 flex items-center gap-4">
          <div
            class="w-12 h-12 rounded-full bg-primary-600/10 text-primary-600 flex items-center justify-center flex-none"
          >
            <mat-icon [svgIcon]="stat.icon" />
          </div>
          <div>
            <div class="text-3xl font-semibold">{{ stat.count }}</div>
            <div class="text-secondary text-sm">
              {{ "dashboard.stats." + stat.key | transloco }}
            </div>
          </div>
        </div>
      }
    </div>
  </app-page-layout-content>
</app-page-layout>
