<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Velto</title>
    <base href="/" />

    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="favicon.png" rel="icon" type="image/png" />
  </head>

  <body dir="ltr">
    <style>
      #app-splash-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #111827;
        z-index: 99999;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
      }

      .app-splash-screen-loader {
        width: 150px;
        height: 22px;
        border-radius: 20px;
        color: #0e7a3d;
        border: 2px solid;
        position: relative;
      }

      .app-splash-screen-loader::before {
        content: "";
        position: absolute;
        margin: 2px;
        inset: 0 100% 0 0;
        border-radius: inherit;
        background: currentColor;
        animation: app-splash-screen-loader-animation 2s forwards;
      }

      @keyframes app-splash-screen-loader-animation {
        100% {
          inset: 0;
        }
      }
    </style>

    <div id="app-splash-screen">
      <img
        height="70"
        width="70"
        loading="eager"
        alt=""
        src="assets/img/logo/logo.png"
      />
      <div class="app-splash-screen-loader"></div>
    </div>

    <app-root></app-root>
  </body>
</html>
