# End-to-end tests. `e2e` shares the network namespace of `app` (ng serve), so the
# browser reaches the app on localhost, exactly like in development.
#
#   scripts/e2e-docker.sh                       run the suite
#   scripts/e2e-docker.sh --update-snapshots    regenerate visual baselines
# Own project name so `down -v` never touches the development containers
name: base-angular-dashboard-e2e

services:
  app:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4200/"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # Keep the image tag in sync with the exact "@playwright/test" version
  e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    network_mode: "service:app"
    ipc: host
    working_dir: /work/e2e
    volumes:
      - .:/work
      - e2e_node_modules:/work/e2e/node_modules
    environment:
      CI: ${CI:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  e2e_node_modules:
