name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -t base-angular-dashboard .
      - name: Smoke test the image
        run: |
          docker run -d --name app -p 8080:8080 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges base-angular-dashboard
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break || sleep 1; done
          curl -fsS localhost:8080/ | grep -q "<app-root>"
          curl -fsSI localhost:8080/deep/link | grep -i "content-security-policy"
          docker logs app

  e2e:
    name: End-to-end and visual tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Playwright in Docker
        run: sh scripts/e2e-docker.sh
        env:
          CI: "true"
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
